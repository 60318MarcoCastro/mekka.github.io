{% extends 'base.html' %}

{% block content %}
<div style="max-width:400px; margin:40px auto; background:#ffffff; padding:25px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);">
    <h2 style="text-align:center; margin-bottom:20px;">Iniciar Sesión</h2>

    <form action="/login" method="POST">
        <div class="form-group" style="margin-bottom:15px;">
            <label><strong>Usuario:</strong></label>
            <input type="text" name="usuario" required autofocus
                   style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        </div>

        <div class="form-group" style="margin-bottom:15px;">
            <label><strong>Contraseña:</strong></label>
            <input type="password" name="password" required
                   style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        </div>

        <button type="submit"
                style="width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer;">
            Entrar
        </button>
    </form>
</div>
{% endblock %}
