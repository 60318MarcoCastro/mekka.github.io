<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <header class="header-ultra">
        <div class="logo-ultra">
         Taller "Porras"
        </div>

        {% if session.usuario %}
        <nav class="nav-ultra">
            <button onclick="location.href='/'">Inicio</button>
            <button onclick="location.href='/clientes'">Clientes</button>
            <button onclick="location.href='/vehiculos'">Vehículos</button>
            <button onclick="location.href='/mecanicos'">Mecánicos</button>
            <button onclick="location.href='/refacciones'">Refacciones</button>
            <button onclick="location.href='/reparaciones'">Reparaciones</button>
            <button onclick="location.href='/logout'">Salir ({{ session.usuario }})</button>
        </nav>
        {% endif %}
    </header>

    <div class="container-ultra">
        {% with mensajes = get_flashed_messages() %}
            {% for m in mensajes %}
            <div style="max-width:800px; margin:0 auto 15px; padding:12px 15px; border-radius:6px; background:#f8d7da; color:#721c24; border:1px solid #f5c6cb;">
                {{ m }}
            </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>

</body>
</html>
