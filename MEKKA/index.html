<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEKKA | Iniciar Sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js"></script>
</head>
<body>

  <header class="header">
    <span class="logo">MEK<span>KA</span></span>
    <button class="theme-toggle" id="theme-toggle" type="button">
      <span class="icon">🌙</span>
      <span class="label">Modo oscuro</span>
    </button>
  </header>

  <div class="login-wrapper">
    <div class="login-card">
      <span class="logo">MEK<span>KA</span></span>
      <p class="tagline">Taller Mecánico · Sistema de gestión</p>

      <form id="login-form">
        <div class="form-group">
          <label for="usuario">Nombre de usuario</label>
          <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <footer class="footer">© 2026 MEKKA Taller Mecánico</footer>

</body>
</html>
