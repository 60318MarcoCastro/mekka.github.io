<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEKKA | Venta</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/script.js"></script>
</head>
<body>

  <header class="header">
    <a href="menu.html" class="logo">MEK<span>KA</span></a>
    <button class="theme-toggle" id="theme-toggle" type="button">
      <span class="icon">🌙</span>
      <span class="label">Modo oscuro</span>
    </button>
  </header>

  <main class="main">
    <a href="menu.html" class="back-link">← Volver al menú principal</a>

    <h1 class="page-title">Venta</h1>
    <p class="page-subtitle">Gestión de ventas del taller</p>

    <div class="menu-grid">
      <button class="menu-btn" type="button" data-pending="Venta">
        <span class="menu-icon">🧾</span>
        Venta
      </button>
      <button class="menu-btn" type="button" data-pending="Clientes">
        <span class="menu-icon">👥</span>
        Clientes
      </button>
      <button class="menu-btn" type="button" data-pending="Devolución">
        <span class="menu-icon">↩️</span>
        Devolución
      </button>
      <button class="menu-btn" type="button" data-pending="Cancelación">
        <span class="menu-icon">❌</span>
        Cancelación
      </button>
      <button class="menu-btn" type="button" data-pending="Facturar">
        <span class="menu-icon">📄</span>
        Facturar
      </button>
      <button class="menu-btn" type="button" data-pending="Salir">
        <span class="menu-icon">🚪</span>
        Salir
      </button>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <footer class="footer">© 2026 MEKKA Taller Mecánico</footer>

</body>
</html>
