{% extends 'base.html' %}

{% block content %}
<h2 style="text-align:center; margin-bottom:20px;">Registro de Mecánicos</h2>

<div style="max-width:800px; margin:auto; background:#ffffff; padding:25px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);">

    <form action="/mecanicos" method="POST" style="margin-bottom:30px;">

        <div class="form-group" style="margin-bottom:15px;">
            <label><strong>Nombre:</strong></label>
            <input type="text" name="nombre" required
                   style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        </div>

        <div class="form-group" style="margin-bottom:15px;">
            <label><strong>Apellidos:</strong></label>
            <input type="text" name="apellidos" required
                   style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        </div>

        <div class="form-group" style="margin-bottom:15px;">
            <label><strong>Teléfono:</strong></label>
            <input type="text" name="telefono"
                   style="width:100%; padding:10px; border-radius:6px; border:1px solid #ccc;">
        </div>

        <button type="submit"
                style="width:100%; padding:12px; background:#007bff; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer;">
            Guardar Mecánico
        </button>

    </form>

    <hr style="margin:30px 0;">

    <h3 style="text-align:center; margin-bottom:15px;">Lista de Mecánicos</h3>

    <table style="width:100%; border-collapse:collapse; text-align:left;">
        <thead>
            <tr style="background:#f0f0f0;">
                <th style="padding:10px; border-bottom:2px solid #ddd;">ID</th>
                <th style="padding:10px; border-bottom:2px solid #ddd;">Nombre</th>
                <th style="padding:10px; border-bottom:2px solid #ddd;">Apellidos</th>
                <th style="padding:10px; border-bottom:2px solid #ddd;">Teléfono</th>
                <th style="padding:10px; border-bottom:2px solid #ddd;">Acción</th>
            </tr>
        </thead>

        <tbody>
            {% for m in mecanicos %}
            <tr style="border-bottom:1px solid #eee;">
                <td style="padding:10px;">{{ m.id_mecanico }}</td>
                <td style="padding:10px;">{{ m.nombre }}</td>
                <td style="padding:10px;">{{ m.apellidos }}</td>
                <td style="padding:10px;">{{ m.telefono }}</td>
                <td style="padding:10px;">
                    <a href="/eliminar_mecanico/{{ m.id_mecanico }}"
                       style="color:white; background:#dc3545; padding:6px 10px; border-radius:5px; text-decoration:none;"
                       onclick="return confirm('¿Eliminar mecánico?')">
                       Eliminar
                    </a>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" style="padding:15px; text-align:center; color:#777;">
                    No hay mecánicos registrados.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>
{% endblock %}
